# Example config for ESP32-CAM stream (VGA 640x480)
webhook_url: null
ai_api_url: 'http://127.0.0.1:5000'
ai_token: 'dev-traffic-node'
dashboard_lane: 'Eastbound camera'
dashboard_location: '12.9177, 77.6238'
model: 'models\\yolov8n.pt'
source: 'http://192.168.1.5:81/stream'
post_interval: 2
detection_conf: 0.15
count_window_s: 60
max_vehicles_for_density: 20
min_green: 20
max_green: 70
yellow_seconds: 3
all_red_seconds: 2

# Recommended ESP32 camera settings (apply on device sketch):
#   frame_size = FRAMESIZE_VGA   # 640x480
#   jpeg_quality = 10            # lower number means better JPEG quality
#   fb_count = 2                 # smoother streaming

# dashboard_location must be "lat, lng" so route search can mark this camera zone red/orange.
# Lanes: pixel coordinates for VGA (640x480). Adjust if your camera is mounted differently.
lanes:
  - name: north_south
    rect: [0, 0, 640, 240]
  - name: east_west
    rect: [0, 240, 640, 480]
